version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: mts_user
      POSTGRES_PASSWORD: mts_password
      POSTGRES_DB: mts_hackathon
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: